<text x="935.0" y="357.0" text-anchor="middle" font-size="12.5" fill="#444">4 regras de alerta</text>
<rect x="1020" y="310" width="125" height="70" rx="10" fill="#fff" stroke="#0b3d6e" stroke-width="2"/>
<text x="1082.5" y="337.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Robô RPA</text>
<text x="1082.5" y="357.0" text-anchor="middle" font-size="12.5" fill="#444">triagem 15 min</text>
<rect x="700" y="430" width="140" height="70" rx="10" fill="#fff" stroke="#0b3d6e" stroke-width="2"/>
<text x="770.0" y="457.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Grafana</text>
<text x="770.0" y="477.0" text-anchor="middle" font-size="12.5" fill="#444">4 sinais de ouro</text>
<rect x="1020" y="430" width="125" height="70" rx="10" fill="#fff" stroke="#0b3d6e" stroke-width="2"/>
<text x="1082.5" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">node-exporter</text>
<text x="1082.5" y="477.0" text-anchor="middle" font-size="12.5" fill="#444">CPU, memória</text>
<text x="1082.5" y="494.0" text-anchor="middle" font-size="12.5" fill="#444">disco</text>
<rect x="690" y="600" width="470" height="100" rx="10" fill="#fffbea" stroke="#a8840b" stroke-width="2"/>
<text x="925.0" y="642.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Dados pessoais (LGPD)</text>
<text x="925.0" y="662.0" text-anchor="middle" font-size="12.5" fill="#444">Nenhum coletado. Ocorrência = tipo + coordenada + descrição sem PII.</text>
<text x="925.0" y="679.0" text-anchor="middle" font-size="12.5" fill="#444">Banco e logs ficam no disco da VM, no Brasil. Segredos só em</text>
<text x="925.0" y="696.0" text-anchor="middle" font-size="12.5" fill="#444">/etc/calcada-livre/.env (root, 600), no tfstate local e no GitHub Secrets.</text>
