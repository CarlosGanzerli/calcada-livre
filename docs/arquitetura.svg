<text x="465.0" y="319.0" text-anchor="middle" font-size="12.5" fill="#444">2. Gitleaks (segredos)</text>
<text x="465.0" y="336.0" text-anchor="middle" font-size="12.5" fill="#444">3. Semgrep (código)</text>
