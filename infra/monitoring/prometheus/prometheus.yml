global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  # Para rodar o Prometheus no seu computador apontando para o MVP publicado,
  # veja infra/monitoring/README.md (o /metrics público é bloqueado de propósito).
