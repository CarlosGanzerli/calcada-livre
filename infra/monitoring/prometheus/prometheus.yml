global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: visao
    metrics_path: /metrics
    static_configs:
      - targets: ["visao:8001"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  # O Prometheus roda na própria VM, na rede interna do compose: o /metrics da API
  # é bloqueado na internet de propósito (infra/caddy/Caddyfile).
